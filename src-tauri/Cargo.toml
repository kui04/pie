[package]
name = "pie"
version = "1.1.0"
description = "A cross-platform GUI for Pi, mobile first"
authors = ["kui04"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Alphabetical by crate name, which `tests/manifest.rs` checks: one list, one
# place, and two people adding the same dependency land in the same spot.
[dependencies]
anyhow = "1"
base64 = "0.23"
camino = { version = "1", features = ["serde1"] }
dirs = "7"
infer = "0.22"
memchr = "2"
mime_guess = "2"
# The wire protocol, mirrored from the pinned Pi release. The crate carries that
# release's commit in its own `[package.metadata.pi_rpc] pi_rev`, and
# `Cargo.lock` holds the crate revision this app resolved.
pi_rpc = { git = "https://github.com/kui04/pi_rpc" }
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-opener = "2.7.0"
tempfile = "3.27.0"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typed-path = "0.13.0"
ureq = "3"

# Alphabetical, like `[dependencies]` above.
[dev-dependencies]
# The integration tests name the types of these two directly: a verifier of host
# keys is handed one, and an sftp client is what a file listing is read through.
# The app re-exports neither, so the tests depend on them as they are.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The debug build is what sits on disk all day, and its debug info is most of it,
# so it is kept for this crate only: a backtrace still names file and line, while
# every dependency under it carries none. No incremental data is written either.
# The test suite inherits this profile.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
