# pnpm settings live here. esbuild's install script is deliberately blocked:
# its platform binary ships as an optional dependency, and `pnpm app:build`,
# `pnpm test` and `pnpm build-storybook` all pass with the script never run.
# Set to true only if a future dependency genuinely needs it.
#
# @google/genai and protobufjs arrive with pi's type packages (see
# `src/lib/rpc-protocol.ts`): pie imports types from them and never runs their
# code, so their install scripts stay off. edgedriver and geckodriver arrive with
# WebdriverIO; the Linux Tauri suite uses WebKitWebDriver, not either browser
# driver. They are answered rather than left out because pnpm refuses to run any
# script while a package it wants to build has no answer here.
allowBuilds:
  "@google/genai": false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: false
# virtua 0.53.2 was published hours before this install. pnpm refuses a package
# inside its release-age window (24 hours, measured on this machine: taking this
# line away makes `pnpm install` fail with
# `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` and a cutoff 24 hours back), and an
# exclusion is how a version that a person has looked at gets in. Where that
# policy is off, this line does nothing. Its peers cover React 19. A person
# removes the line once virtua's pinned version is older than that window: pnpm
# prunes these entries only when `minimumReleaseAgeExcludePrune` is on, and it is
# off here.
minimumReleaseAgeExclude:
  - virtua@0.53.2
